syntax = "proto3";

package bsvms.v1;

option go_package = "github.com/brad1121/bsvms/gen/bsvms/v1;bsvmspb";

service BSVMS {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (AuthTokens);
  rpc ConnectPeer(ConnectPeerRequest) returns (ConnectPeerResponse);
  rpc ListWallets(ListWalletsRequest) returns (ListWalletsResponse);
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  rpc RestoreWallet(RestoreWalletRequest) returns (WalletResponse);
  rpc GetWallet(GetWalletRequest) returns (WalletResponse);
  rpc NewAddress(NewAddressRequest) returns (AddressResponse);
  rpc BatchNewAddresses(BatchNewAddressesRequest) returns (BatchNewAddressesResponse);
  rpc DeriveAt(DeriveAtRequest) returns (AddressResponse);
  rpc PubKeyAt(PubKeyAtRequest) returns (PubKeyAtResponse);
  rpc SignHashAt(SignHashAtRequest) returns (SignHashAtResponse);
  rpc NextIndex(NextIndexRequest) returns (NextIndexResponse);
  rpc Balance(BalanceRequest) returns (BalanceResponse);
  rpc ListUTXOs(ListUTXOsRequest) returns (ListUTXOsResponse);
  rpc ImportUTXO(ImportUTXORequest) returns (ImportUTXOResponse);
  rpc ProcessRawTx(ProcessRawTxRequest) returns (ProcessRawTxResponse);
  rpc ClearUTXOs(ClearUTXOsRequest) returns (ClearUTXOsResponse);
  rpc ReloadFromStore(ReloadFromStoreRequest) returns (ReloadFromStoreResponse);
  rpc WipeWallet(WipeWalletRequest) returns (WipeWalletResponse);
  rpc PruneUnknownUTXOs(PruneUnknownUTXOsRequest) returns (PruneUnknownUTXOsResponse);
  rpc IgnoreOutpoint(IgnoreOutpointRequest) returns (IgnoreOutpointResponse);
  rpc IsOutpointIgnored(IsOutpointIgnoredRequest) returns (IsOutpointIgnoredResponse);
  rpc UntrackUTXO(UntrackUTXORequest) returns (UntrackUTXOResponse);
  rpc CanCover(CanCoverRequest) returns (CanCoverResponse);
  rpc Send(SendRequest) returns (SpendResponse);
  rpc SendAll(SendAllRequest) returns (SpendResponse);
  rpc SpendToOutputs(SpendToOutputsRequest) returns (SpendDetailResponse);
  rpc BroadcastCustomSpend(BroadcastCustomSpendRequest) returns (SpendResponse);
  rpc P2PKHOutput(P2PKHOutputRequest) returns (OutputSpec);
  rpc OpReturnOutput(OpReturnOutputRequest) returns (OutputSpec);
  rpc AnyoneCanSpendOutput(AnyoneCanSpendOutputRequest) returns (OutputSpec);
  rpc ParseTransaction(ParseTransactionRequest) returns (Transaction);
  rpc BroadcastRaw(BroadcastRawRequest) returns (BroadcastRawResponse);
  rpc ExecuteScript(ExecuteScriptRequest) returns (ExecuteScriptResponse);
  rpc DecodeOutputAddress(DecodeOutputAddressRequest) returns (DecodeOutputAddressResponse);
  rpc PendingTransactions(PendingTransactionsRequest) returns (PendingTransactionsResponse);
  rpc RebroadcastPendingTransactions(RebroadcastPendingTransactionsRequest) returns (RebroadcastPendingTransactionsResponse);
  rpc StreamTransactions(StreamTransactionsRequest) returns (stream Transaction);
  rpc StreamBlocks(StreamBlocksRequest) returns (stream Block);
  rpc StreamPayments(StreamPaymentsRequest) returns (stream Payment);
  rpc StreamWalletTransactions(StreamWalletTransactionsRequest) returns (stream WalletTransaction);
  rpc StreamP2PTraffic(StreamP2PTrafficRequest) returns (stream P2PTraffic);
  rpc StreamRejects(StreamRejectsRequest) returns (stream Reject);
  rpc TxState(TxStateRequest) returns (TxStateResponse);
  rpc AbandonTransaction(AbandonTransactionRequest) returns (AbandonTransactionResponse);
  rpc ClearIgnoredOutpoints(ClearIgnoredOutpointsRequest) returns (ClearIgnoredOutpointsResponse);
  rpc OwnsScript(OwnsScriptRequest) returns (OwnsScriptResponse);
  rpc VerifyTxSeen(VerifyTxSeenRequest) returns (VerifyTxSeenResponse);
  rpc WaitForTxRelay(WaitForTxRelayRequest) returns (WaitForTxRelayResponse);
  rpc Rescan(RescanRequest) returns (stream RescanEvent);
  rpc GetIncompleteCursor(GetIncompleteCursorRequest) returns (GetIncompleteCursorResponse);
}

message StatusRequest {}

message StatusResponse {
  string network = 1;
  int32 chain_height = 2;
  int32 best_peer_height = 3;
  int32 peer_count = 4;
  string data_dir = 5;
  map<string, int32> peer_heights = 6;
  // Confirmations a coinbase output needs before it can be spent.
  int32 coinbase_maturity = 7;
}

message AuthTokens {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  string expires_at = 4;
  string tenant_id = 5;
  string wallet_id = 6;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message ConnectPeerRequest {
  string address = 1;
}

message ConnectPeerResponse {}

message TenantWallet {
  string tenant_id = 1;
  string wallet_id = 2;
}

message Wallet {
  string tenant_id = 1;
  string wallet_id = 2;
  repeated string addresses = 3;
  int64 balance_satoshis = 4;
  double balance_bsv = 5;
  uint32 next_external_index = 6;
  uint32 next_change_index = 7;
  string selector = 8;
  // balance_satoshis counts immature coinbase; spendable_satoshis is what a
  // send can draw on now. See BalanceResponse.
  int64 spendable_satoshis = 9;
  int64 immature_satoshis = 10;
}

message ListWalletsRequest {
  string tenant_id = 1;
}

message ListWalletsResponse {
  repeated Wallet wallets = 1;
}

message CreateWalletRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message CreateWalletResponse {
  Wallet wallet = 1;
  string mnemonic = 2;
  AuthTokens tokens = 3;
}

message RestoreWalletRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string mnemonic = 3;
  string passphrase = 4;
}

message WalletResponse {
  Wallet wallet = 1;
  AuthTokens tokens = 2;
}

message GetWalletRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message NewAddressRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message DerivedAddress {
  string address = 1;
  string path = 2;
  bytes pub_key = 3;
  bytes script = 4;
  uint32 branch = 5;
  uint32 index = 6;
}

message AddressResponse {
  DerivedAddress address = 1;
}

message BatchNewAddressesRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  int32 count = 3;
}

message BatchNewAddressesResponse {
  repeated DerivedAddress addresses = 1;
}

message DeriveAtRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  uint32 branch = 3;
  uint32 index = 4;
}

message PubKeyAtRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  uint32 branch = 3;
  uint32 index = 4;
}

message PubKeyAtResponse {
  bytes pub_key = 1;
  string address = 2;
}

message SignHashAtRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  uint32 branch = 3;
  uint32 index = 4;
  bytes hash = 5;
}

message SignHashAtResponse {
  bytes signature = 1;
  bytes pub_key = 2;
}

message NextIndexRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  uint32 branch = 3;
}

message NextIndexResponse {
  uint32 next_index = 1;
}

message BalanceRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message BalanceResponse {
  // satoshis is the total balance, immature coinbase included.
  int64 satoshis = 1;
  double bsv = 2;
  // spendable is satoshis minus immature; what a send can draw on now.
  int64 spendable = 3;
  // immature sits in coinbase outputs younger than coinbase_maturity.
  int64 immature = 4;
}

message UTXO {
  string txid = 1;
  uint32 vout = 2;
  int64 value = 3;
  bytes script = 4;
  int32 height = 5;
  // is_coinbase marks a mining reward: counted in balance but skipped by
  // coin selection until coinbase_maturity confirmations have passed.
  bool is_coinbase = 6;
}

message ListUTXOsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message ListUTXOsResponse {
  repeated UTXO utxos = 1;
}

message ImportUTXORequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string txid = 3;
  uint32 vout = 4;
  int64 value = 5;
  bytes script = 6;
  int32 height = 7;
  bool force = 8;
  // is_coinbase is honoured only with force; restoring a coinbase as an
  // ordinary coin puts it back into coin selection before it is spendable.
  bool is_coinbase = 9;
}

message ImportUTXOResponse {}

message ProcessRawTxRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  bytes raw_tx = 3;
  int32 height = 4;
}

message ProcessRawTxResponse {}

message ClearUTXOsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message ClearUTXOsResponse {
  int32 cleared = 1;
}

message ReloadFromStoreRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message ReloadFromStoreResponse {
  int32 loaded = 1;
}

message WipeWalletRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message WipeWalletResponse {
  int32 removed = 1;
}

message PruneUnknownUTXOsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message PruneUnknownUTXOsResponse {
  int32 removed = 1;
}

message IgnoreOutpointRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string txid = 3;
  uint32 vout = 4;
  bool unignore = 5;
}

message IgnoreOutpointResponse {}

message IsOutpointIgnoredRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string txid = 3;
  uint32 vout = 4;
}

message IsOutpointIgnoredResponse {
  bool ignored = 1;
}

message UntrackUTXORequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string txid = 3;
  uint32 vout = 4;
}

message UntrackUTXOResponse {
  int64 removed_value = 1;
}

message CanCoverRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  int64 total_out = 3;
  int64 fee_per_byte = 4;
  int32 fixed_outputs = 5;
}

message CanCoverResponse {}

message SendRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string to_address = 3;
  int64 amount_satoshis = 4;
}

message SendAllRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string to_address = 3;
  bool detailed = 4;
}

message SpendResponse {
  string txid = 1;
}

message OutputSpec {
  bytes script = 1;
  int64 value = 2;
}

message OutPoint {
  string txid = 1;
  uint32 vout = 2;
}

message SpendToOutputsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  repeated OutputSpec outputs = 3;
  bool ignore_fixed_outputs = 4;
  // from_inputs restricts coin selection to these outpoints (plus change).
  // Mutually exclusive with ignore_fixed_outputs.
  repeated OutPoint from_inputs = 5;
}

message SpendDetail {
  string txid = 1;
  repeated UTXO spent_utxos = 2;
  optional UTXO change_utxo = 3;
  bytes raw_tx = 4;
}

message SpendDetailResponse {
  SpendDetail detail = 1;
}

message CustomInput {
  string txid = 1;
  uint32 vout = 2;
  bytes script_sig = 3;
  uint32 sequence = 4;
}

message BroadcastCustomSpendRequest {
  repeated CustomInput inputs = 1;
  repeated OutputSpec outputs = 2;
}

message P2PKHOutputRequest {
  string address = 1;
  int64 value = 2;
}

message OpReturnOutputRequest {
  bytes data = 1;
}

message AnyoneCanSpendOutputRequest {
  int64 value = 1;
}

message ParseTransactionRequest {
  bytes raw_tx = 1;
}

message Transaction {
  string txid = 1;
  bytes raw_tx = 2;
  repeated TxInput inputs = 3;
  repeated TxOutput outputs = 4;
}

message TxInput {
  string prev_txid = 1;
  uint32 prev_vout = 2;
  bytes script_sig = 3;
  bool coinbase = 4;
  string sender_address = 5;
}

message TxOutput {
  uint32 vout = 1;
  int64 value = 2;
  bytes script = 3;
  string address = 4;
}

message BroadcastRawRequest {
  bytes raw_tx = 1;
}

message BroadcastRawResponse {
  string txid = 1;
}

message ExecuteScriptRequest {
  bytes script_sig = 1;
  bytes script_pub_key = 2;
  bytes raw_tx = 3;
  int32 input_index = 4;
  int64 amount = 5;
  // strict also applies the standard relay flags: a script that passes
  // without it but fails with it is consensus-valid yet non-standard.
  bool strict = 6;
}

message ExecuteScriptResponse {
  bool ok = 1;
  string error = 2;
}

message DecodeOutputAddressRequest {
  bytes script_pub_key = 1;
}

message DecodeOutputAddressResponse {
  string address = 1;
  bool ok = 2;
}

message PendingTransactionsRequest {}

message PendingTransaction {
  string txid = 1;
  string first_broadcast = 2;
  string last_broadcast = 3;
  string last_announce = 4;
  int32 rebroadcasts = 5;
}

message PendingTransactionsResponse {
  repeated PendingTransaction transactions = 1;
}

message RebroadcastPendingTransactionsRequest {}

message RebroadcastPendingTransactionsResponse {
  int32 count = 1;
}

message StreamTransactionsRequest {}

message Block {
  string hash = 1;
  int32 height = 2;
  repeated string txids = 3;
  repeated BlockSpend spends = 4;
  // disconnected marks a block the chain abandoned in a reorganisation,
  // emitted deepest first before its replacement is applied. txids and
  // spends are empty on these; consumers keeping their own mined index
  // should drop the block at this hash.
  bool disconnected = 5;
}

message BlockSpend {
  string prev_txid = 1;
  uint32 prev_vout = 2;
  string spending_txid = 3;
}

message StreamBlocksRequest {}

message Payment {
  string tenant_id = 1;
  string wallet_id = 2;
  string txid = 3;
  int64 amount = 4;
  string address = 5;
  uint32 vout = 6;
  bytes script = 7;
}

message StreamPaymentsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message OwnedOutput {
  uint32 vout = 1;
  int64 value = 2;
  bytes script = 3;
  string address = 4;
}

message SpentOutPoint {
  string txid = 1;
  uint32 vout = 2;
}

message WalletTransaction {
  string tenant_id = 1;
  string wallet_id = 2;
  Transaction transaction = 3;
  repeated OwnedOutput owned = 4;
  repeated SpentOutPoint spent = 5;
}

message StreamWalletTransactionsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message P2PTraffic {
  string peer = 1;
  string direction = 2;
  string command = 3;
  int32 payload_bytes = 4;
  string summary = 5;
}

message StreamP2PTrafficRequest {}

message Reject {
  string peer = 1;
  string command = 2;
  uint32 code = 3;
  string code_name = 4;
  string reason = 5;
  string hash = 6;
}

message StreamRejectsRequest {}

message TxStateRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string txid = 3;
}

message TxStateResponse {
  // known is false when the wallet store has never seen this txid.
  bool known = 1;
  // height the tx confirmed at, or -1 while unconfirmed.
  int32 height = 2;
  bool confirmed = 3;
  // conflicted means the tx can no longer confirm: a confirmed tx took one
  // of its inputs, an ancestor is conflicted, or it was abandoned.
  bool conflicted = 4;
}

message AbandonTransactionRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  string txid = 3;
}

message AbandonTransactionResponse {}

message ClearIgnoredOutpointsRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

message ClearIgnoredOutpointsResponse {
  int32 cleared = 1;
}

message OwnsScriptRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  bytes script_pub_key = 3;
}

message OwnsScriptResponse {
  bool owned = 1;
}

message VerifyTxSeenRequest {
  string txid = 1;
  // peers_to_ask defaults to 1.
  int32 peers_to_ask = 2;
  // timeout_ms defaults to 10000.
  int32 timeout_ms = 3;
}

message VerifyTxSeenResponse {
  bool seen = 1;
}

message WaitForTxRelayRequest {
  string txid = 1;
  // timeout_ms defaults to 10000.
  int32 timeout_ms = 2;
}

message WaitForTxRelayResponse {
  bool relayed = 1;
}

// Rescan replays every block from a starting point back through a wallet, to
// recover state after a restore or a long outage. It is a recovery path, not a
// hot path: every block is pulled in full over P2P, which on mainnet can mean
// hundreds of MB and minutes of wall time. One rescan runs per wallet at a
// time. Cancelling the stream cancels the walk, and the blocks already
// replayed stay applied.
message RescanRequest {
  string tenant_id = 1;
  string wallet_id = 2;
  // start_block_hash is display-order hex: the block to walk forward from,
  // chosen to predate any activity the wallet may have missed.
  string start_block_hash = 3;
  // start_height is the absolute height of start_block_hash. Without it every
  // replayed transaction is stamped unconfirmed and historical conflicts are
  // not reconciled, so set it whenever the height is known.
  int32 start_height = 4;
  // max_blocks caps the walk. 0 uses the SDK default of 2000; unbounded walks
  // are not offered here.
  int32 max_blocks = 5;
  int32 headers_timeout_ms = 6;
  int32 block_timeout_ms = 7;
  int32 max_consecutive_block_errors = 8;
  // checkpoint_every flushes the address snapshot every N blocks. 0 disables.
  int32 checkpoint_every = 9;
  // gc_every returns allocator slack to the OS every N blocks. 0 disables.
  int32 gc_every = 10;
  // prefetch is how many block requests may be in flight at once. 0 uses one
  // per connected peer, 1 restores serial fetching.
  int32 prefetch = 11;
  int64 prefetch_bytes = 12;
  int64 stream_block_bytes = 13;
}

message RescanProgress {
  string phase = 1;
  string peer = 2;
  int32 headers_seen = 3;
  int32 batch_headers = 4;
  int32 blocks_fetched = 5;
  int32 txs_replayed = 6;
  int32 errors = 7;
  string block_hash = 8;
  string message = 9;
}

message RescanStats {
  int32 headers_seen = 1;
  int32 blocks_fetched = 2;
  int32 txs_replayed = 3;
  // stopped_at is the last block whose transactions were replayed, in
  // display-order hex, or empty if none were.
  string stopped_at = 4;
  int32 stopped_height = 5;
  // peer_switches counts how often the walk moved to another peer to keep
  // making progress.
  int32 peer_switches = 6;
  // errors are non-fatal: the walk carried on past them.
  repeated string errors = 7;
}

// RescanEvent is a progress heartbeat while the walk runs, then exactly one
// stats message as the final item on the stream.
message RescanEvent {
  oneof event {
    RescanProgress progress = 1;
    RescanStats stats = 2;
  }
}

message GetIncompleteCursorRequest {
  string tenant_id = 1;
  string wallet_id = 2;
}

// GetIncompleteCursorResponse reports a block the wallet began applying but
// never finished, which is how a crash mid-block shows up. Call it at startup:
// when found is set, rescan from height - 1 to make the wallet whole.
message GetIncompleteCursorResponse {
  bool found = 1;
  string block_hash = 2;
  int32 height = 3;
  int32 tx_done = 4;
  int32 tx_total = 5;
}
